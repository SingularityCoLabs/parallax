name: Feature request
description: Propose a focused improvement to Parallax.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. For large architectural changes,
        describe the problem and constraints before investing in an implementation.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I have read and agree to follow the Code of Conduct.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or user need should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior without assuming a specific implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or alternative designs.
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Explain effects on permissions, approvals, filesystem access, shell execution, persistence, or existing APIs.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add examples, diagrams, or related links.
