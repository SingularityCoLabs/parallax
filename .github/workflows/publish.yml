name: Publish package

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

jobs:
  publish-main:
    name: Publish main release to npm
    if: >-
      ${{ github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm with trusted-publishing support
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select the release version
        id: release
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          current_version="$(node -p "require('./package.json').version")"

          git fetch --force --tags origin main

          # A rerun may start from the original main push after an earlier
          # attempt already created its release commit and tag. Reuse that
          # release instead of calculating and publishing another version.
          release_tag=""
          release_commit=""
          while IFS= read -r candidate_tag; do
            candidate_commit="$(git rev-list -n 1 "${candidate_tag}")"
            candidate_parent="$(git rev-parse "${candidate_commit}^" 2>/dev/null || true)"
            candidate_subject="$(git log -1 --format=%s "${candidate_commit}")"

            if [[ "${candidate_commit}" == "${SOURCE_SHA}" ]] || \
              [[ "${candidate_parent}" == "${SOURCE_SHA}" && \
                "${candidate_subject}" == "chore(release): ${candidate_tag} [skip ci]" ]]; then
              release_tag="${candidate_tag}"
              release_commit="${candidate_commit}"
              break
            fi
          done < <(git tag --sort=-version:refname --list 'v*')

          if [[ -n "${release_tag}" ]]; then
            package_version="${release_tag#v}"
            git checkout --detach "${release_commit}"
            npm version "${package_version}" --no-git-tag-version --allow-same-version
            release_mode=resume
            tag_exists=true
          else
            published_versions="[]"
            if registry_versions="$(npm view "${package_name}" versions --json 2>/dev/null)"; then
              published_versions="${registry_versions}"
            fi

            package_version="$(
              printf '%s' "${published_versions}" |
                node scripts/next-release-version.mjs "${current_version}"
            )"
            release_tag="v${package_version}"

            if git show-ref --verify --quiet "refs/tags/${release_tag}"; then
              tag_commit="$(git rev-list -n 1 "${release_tag}")"
              echo "${release_tag} already belongs to ${tag_commit}, not ${SOURCE_SHA}." >&2
              exit 1
            fi

            npm version "${package_version}" --no-git-tag-version --allow-same-version
            release_mode=new
            tag_exists=false
          fi

          published_version="$(npm view "${package_name}@${package_version}" version 2>/dev/null || true)"
          if [[ "${published_version}" == "${package_version}" ]]; then
            needs_publish=false
          else
            needs_publish=true
          fi

          echo "mode=${release_mode}" >> "${GITHUB_OUTPUT}"
          echo "package_name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "package_version=${package_version}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "tag_exists=${tag_exists}" >> "${GITHUB_OUTPUT}"
          echo "needs_publish=${needs_publish}" >> "${GITHUB_OUTPUT}"

          echo "Selected ${package_name}@${package_version} (${release_mode})."

      - name: Verify release artifact
        if: ${{ steps.release.outputs.needs_publish == 'true' }}
        run: pnpm verify:release

      - name: Record the release version and tag
        if: ${{ steps.release.outputs.tag_exists == 'false' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${RELEASE_TAG} [skip ci]"
          fi

          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/${RELEASE_TAG}"

      - name: Publish to npm with provenance
        if: ${{ steps.release.outputs.needs_publish == 'true' }}
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        run: |
          set -euo pipefail

          if [[ "${PACKAGE_VERSION}" == *-* ]]; then
            npm_tag=next
          else
            npm_tag=latest
          fi
          npm publish --provenance --tag "${npm_tag}" --access public

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists."
            exit 0
          fi

          release_flags=(
            --repo "${GITHUB_REPOSITORY}"
            --verify-tag
            --generate-notes
            --title "${RELEASE_TAG}"
          )
          if [[ "${PACKAGE_VERSION}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${RELEASE_TAG}" "${release_flags[@]}"

      - name: Summarize main publication
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
          RELEASE_MODE: ${{ steps.release.outputs.mode }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          printf 'Released `%s@%s` from `main` with Git tag `%s` (mode: `%s`).\n' \
            "${PACKAGE_NAME}" "${PACKAGE_VERSION}" "${RELEASE_TAG}" "${RELEASE_MODE}" \
            >> "${GITHUB_STEP_SUMMARY}"

  validate-development-publish:
    name: Validate development publish request
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the development branch
        env:
          EXPECTED_REF: refs/heads/development
        run: |
          if [[ "${GITHUB_REF}" != "${EXPECTED_REF}" ]]; then
            echo "Run this workflow from the development branch, not ${GITHUB_REF}." >&2
            exit 1
          fi

  publish-development:
    name: Publish development snapshot to npm
    needs: validate-development-publish
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out development
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use npm with trusted-publishing support
        run: npm install --global npm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set unique development version
        run: |
          base_version="$(node -p "require('./package.json').version.split('-')[0]")"
          development_version="${base_version}-dev.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          npm version "${development_version}" --no-git-tag-version
          echo "DEVELOPMENT_VERSION=${development_version}" >> "${GITHUB_ENV}"

      - name: Verify development artifact
        run: pnpm verify:release

      - name: Publish development snapshot
        run: npm publish --provenance --tag dev --access public

      - name: Summarize publication
        run: |
          package_name="$(node -p "require('./package.json').name")"
          printf 'Published `%s@%s` with npm dist-tag `dev`.\n' \
            "${package_name}" "${DEVELOPMENT_VERSION}" >> "${GITHUB_STEP_SUMMARY}"
